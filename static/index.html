<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B5B">
<title>DoOver 错题本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C75 16 88 36 88 58 C88 79 72 90 50 90 C28 90 12 79 12 58 C12 36 25 16 50 16 Z' fill='%23FF6B5B'/%3E%3Ccircle cx='38' cy='45' r='9' fill='%23fff'/%3E%3Ccircle cx='63' cy='45' r='9' fill='%23fff'/%3E%3Ccircle cx='38' cy='46' r='4.2' fill='%232A2320'/%3E%3Ccircle cx='63' cy='46' r='4.2' fill='%232A2320'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录遮罩 -->
<div id="loginMask" class="login-mask hidden">
  <div class="login-card">
    <div id="loginMonster" class="login-monster"></div>
    <h1 class="login-title">DoOver 错题本</h1>
    <p class="login-sub">小题大做 · 消灭每一道错题</p>
    <input id="loginCode" type="password" inputmode="numeric" autocomplete="off"
           maxlength="12" placeholder="请输入访问码" class="login-input">
    <button id="loginBtn" class="btn btn-brand btn-xl">进入错题本</button>
    <p id="loginErr" class="login-err"></p>
  </div>
</div>

<header class="topbar">
  <div class="topbar-left">
    <span class="logo-dot"></span><span class="logo">DoOver</span><span class="logo-sub">错题本</span>
  </div>
  <div class="topbar-right" id="topRight"></div>
</header>

<main id="app">
  <section id="page-today" class="page"></section>
  <section id="page-items" class="page hidden"></section>
  <section id="page-add" class="page hidden"></section>
  <section id="page-stats" class="page hidden"></section>
  <section id="page-me" class="page hidden"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="today">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M13 2 4.5 13.5h5L9 22l9-11.5h-5.5z"/></svg>
    <span>今日</span>
  </button>
  <button class="tab" data-tab="items">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M5 3h9a3 3 0 0 1 3 3v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-1.7zM7 6v12h8V6z"/></svg>
    <span>错题本</span>
  </button>
  <button class="tab tab-add" data-tab="add" aria-label="加题">
    <span class="ic"><svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg></span>
  </button>
  <button class="tab" data-tab="stats">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 13h3v8H4zm6.5-6h3v14h-3zM17 9h3v12h-3z"/></svg>
    <span>统计</span>
  </button>
  <button class="tab" data-tab="me">
    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2l2.9 6.3 6.6.7-5 4.6 1.4 6.6L12 16.9 6.1 20.2l1.4-6.6-5-4.6 6.6-.7z"/></svg>
    <span>我的</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal-mask hidden"><div class="modal" id="modalBody"></div></div>

<script src="app.js"></script>
</body>
</html>
